<script>
        // Mapeo detallado de módulos
        const modulosData = {
            'retail': { 
                titulo: 'Módulo: Retail & PyMEs', 
                items: [
                    { 
                        titulo: 'Imágenes en preparación...', 
                        // Usamos un placeholder profesional hasta que subas 'retail1.png'
                        archivo: 'https://via.placeholder.com/800x450/0d1117/00bfff?text=Interfaz+Retail+en+preparaci%C3%B3n' 
                    }
                ]
            },
            'salon': { 
                titulo: 'Módulo: Salones de Belleza & Estética', 
                items: [
                    { 
                        titulo: 'Imágenes en preparación...', 
                        // Usamos un placeholder profesional hasta que subas 'salon1.png'
                        archivo: 'https://via.placeholder.com/800x450/0d1117/ec4899?text=Interfaz+Salones+en+preparaci%C3%B3n' 
                    }
                ]
            },
            'web': { 
                titulo: 'Módulo: E-commerce, Catálogos & Sincronización Web', 
                items: [
                    { titulo: '1. Panel Central de Carga de Archivos', archivo: 'captura1.png' },
                    { titulo: '2. Calculadora de Stock Real (Depósito vs Reservas)', archivo: 'captura2.png' },
                    { titulo: '3. Generador de Catálogos Express y Flyers', archivo: 'captura3.png' },
                    { titulo: '4. Catálogo Final en Formato PDF A4', archivo: 'captura4.png' },
                    { titulo: '5. Flyer Exportado para WhatsApp / Redes', archivo: 'captura5.png' },
                    { titulo: '6. Auditoría de Productos Faltantes por Publicar', archivo: 'captura6.png' }
                ]
            }
        };

        const modal = document.getElementById('imageModal');
        const modalBody = document.getElementById('modalBody');
        const modalTitle = document.getElementById('modalTitle');

        function abrirModal(modulo) {
            const data = modulosData[modulo];
            modalTitle.innerText = data.titulo;
            
            // Inyectamos las imágenes con el ancho al 100% para evitar el scroll horizontal feo
            modalBody.innerHTML = data.items.map(item => `
                <div class="modal-item">
                    <span class="modal-item-title">${item.titulo}</span>
                    <img src="${item.archivo}" style="width: 100%; height: auto; max-width: 100%; display: block;" alt="${item.titulo}">
                </div>
            `).join('');
            
            document.body.classList.add('modal-open'); 
            modal.classList.add('active');
            modalBody.scrollTop = 0; 
        }

        function cerrarModal() {
            modal.classList.remove('active');
            document.body.classList.remove('modal-open');
        }
        
        function cerrarModalFondo(e) {
            if (e.target === modal) cerrarModal();
        }

        // Destellos de cursor
        const colors = ['#00bfff', '#4dd2ff', '#80dfff']; 
        document.addEventListener('mousemove', function(e) {
            if (document.body.classList.contains('modal-open')) return; 
            
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = e.clientX + 'px';
            sparkle.style.top = e.clientY + 'px';
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sparkle.style.backgroundColor = randomColor;
            sparkle.style.boxShadow = `0 0 10px ${randomColor}, 0 0 20px #fff`;
            document.body.appendChild(sparkle);
            setTimeout(() => { sparkle.remove(); }, 800);
        });
    </script>
